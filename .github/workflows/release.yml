name: Release VSIX

on:
    push:
        tags:
            - 'v*'

permissions:
    contents: write
    pages: write
    id-token: write

jobs:
    release:
        name: Build and release VSIX
        runs-on: ubuntu-latest
        environment:
            name: github-pages
            url: ${{ steps.deployment.outputs.page_url }}

        steps:
            - name: Check out repository
              uses: actions/checkout@v4

            - name: Set up Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: 22
                  cache: yarn

            - name: Install dependencies
              run: yarn install --frozen-lockfile

            - name: Read version from tag
              id: version
              env:
                  TAG_NAME: ${{ github.ref_name }}
              run: |
                  VERSION="${TAG_NAME#v}"
                  if ! yarn --silent semver "$VERSION" >/dev/null; then
                    echo "Tag must be a valid semantic version prefixed with v (for example, v1.2.3)." >&2
                    exit 1
                  fi
                  echo "version=$VERSION" >> "$GITHUB_OUTPUT"
                  echo "vsix=project-atlas-vs-$VERSION.vsix" >> "$GITHUB_OUTPUT"

            - name: Set package version
              env:
                  VERSION: ${{ steps.version.outputs.version }}
              run: npm pkg set version="$VERSION"

            - name: Test (excluding proxy tests)
              env:
                  NODE_OPTIONS: --no-deprecation
              run: xvfb-run -a yarn test --grep proxy --invert

            - name: Package extension
              env:
                  VSIX_FILE: ${{ steps.version.outputs.vsix }}
              run: yarn package:extension --out "$VSIX_FILE"

            - name: Generate checksums
              env:
                  VSIX_FILE: ${{ steps.version.outputs.vsix }}
              run: sha256sum "$VSIX_FILE" > checksums.txt

            - name: Create GitHub Release
              env:
                  GH_TOKEN: ${{ github.token }}
                  TAG_NAME: ${{ github.ref_name }}
                  VSIX_FILE: ${{ steps.version.outputs.vsix }}
              run: gh release create "$TAG_NAME" "$VSIX_FILE" checksums.txt --verify-tag --generate-notes --title "$TAG_NAME"

            - name: Generate update manifest
              env:
                  VERSION: ${{ steps.version.outputs.version }}
                  VSIX_FILE: ${{ steps.version.outputs.vsix }}
              run: |
                  SHA256="$(sha256sum "$VSIX_FILE" | awk '{print $1}')"
                  mkdir -p pages/update
                  jq -n \
                    --arg version "$VERSION" \
                    --arg publishedAt "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
                    --arg sha256 "$SHA256" \
                    '{schemaVersion: 1, channel: "stable", latestVersion: $version, publishedAt: $publishedAt, releaseNotes: ("https://github.com/hyxf/project-atlas-vs/releases/tag/v" + $version), download: {url: ("https://github.com/hyxf/project-atlas-vs/releases/download/v" + $version + "/project-atlas-vs-" + $version + ".vsix"), fileName: ("project-atlas-vs-" + $version + ".vsix"), sha256: $sha256}, compatibility: {vscode: ">=1.134.0"}}' \
                    > pages/update/stable.json

            - name: Configure GitHub Pages
              uses: actions/configure-pages@v5

            - name: Upload GitHub Pages artifact
              uses: actions/upload-pages-artifact@v4
              with:
                  path: pages

            - name: Deploy GitHub Pages
              id: deployment
              uses: actions/deploy-pages@v4
